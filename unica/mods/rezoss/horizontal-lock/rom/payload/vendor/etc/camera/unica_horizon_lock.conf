# Experimental rear-camera horizon lock; cardinal portrait/landscape starts.
# Mode 2, sensor 0, 2400x1352 ICA domain; maximum correction target 180 degrees.
# Fixed 2.2x ADDITIONAL crop for arbitrary-roll geometry; shaking may remain.
# This is an experimental budget, not a recovered S26U magnification.
enabled=1
# Set to 0 to restore the earlier adaptive crop with known zoom pumping.
fixed_crop=1
# Experimental batch timing and bounded filter-lag compensation; set 0 to
# restore the previous arithmetic-mean/120ms-filter orientation path.
orientation_timing=1
