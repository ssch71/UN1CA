name: Qwen model APK

# Builds the separately installable Now Nudge / AI reply model APK
# (io.mesalabs.rezoss.qwen.v73). Needs no stock firmware, so it does not
# depend on Samsung FUS and can run on its own.
on:
  workflow_dispatch:
  push:
    branches:
      - 'sembilan'
    paths:
      - 'unica/mods/rezoss/qwen-llm/**'
      - 'unica/mods/rezoss/aioskernel/native-now-nudge/config.sh'
      - 'unica/mods/rezoss/aioskernel/native-now-nudge/verify_payload.py'
      - 'unica/mods/rezoss/aioskernel/native-now-nudge/payload/**'
      - '.github/workflows/qwen-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Qwen model APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo (only what the APK needs)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            security
            unica/mods/rezoss/qwen-llm
            unica/mods/rezoss/aioskernel/native-now-nudge

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER":"$USER" /usr/local/lib/android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Build APK
        env:
          # Same model APK for every SM8550 target (dm1q/dm2q/dm3q/b5q/q5q).
          TARGET_CODENAME: dm1q
        run: |
          export SRC_DIR="$GITHUB_WORKSPACE"
          bash unica/mods/rezoss/qwen-llm/build.sh "$GITHUB_WORKSPACE/out/QWEN_LLM_rezoss.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QWEN_LLM_rezoss
          path: out/QWEN_LLM_rezoss.apk
          compression-level: 0
          retention-days: 14
