name: CI-flip-fold

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sembilan'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

  generate-matrix:
    name: Generate matrix
    needs: shellcheck
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate CI matrix
        id: generate-matrix
        run: |
          matrix="$(find target -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [shellcheck, generate-matrix]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [b5q]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp
          sudo apt install -yq "linux-modules-extra-$(uname -r)" || echo "::warning::linux-modules-extra-$(uname -r) is not available"
          sudo modprobe -a erofs f2fs || echo "::warning::erofs/f2fs kernel modules are not available"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER":"$USER" /usr/local/lib/android

      - name: Set up Android SDK (local-summary build)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Install smali tools
        run: |
          sudo apt install -yq smali
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Check local-summary toolchain
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>} SDK=$SDK"
          ls -d "$SDK"/platforms/* "$SDK"/build-tools/* 2>&1 | head
          for t in javac jar smali baksmali aapt2 zipalign apksigner keytool; do
            printf "%s: " "$t"; command -v "$t" || echo MISSING
          done

      - name: Build ROM
        run: ./scripts/make_rom.sh

      - name: Collect patch debug files
        if: failure()
        run: |
          mkdir -p /tmp/patchdbg
          # Rejected hunks from every failed smali patch
          find out -type f -name "*.rej" -exec cp --parents {} /tmp/patchdbg \;
          # HoneyBoard: classes targeted by rezoss patches (obfuscated names change between firmwares)
          HB=$(find out/target -type d -path "*apktool*" -name "HoneyBoard.apk" | head -1)
          if [ -n "$HB" ]; then
            grep -rlE 'updateSuggestResponse|inaccessible mode|ro\.product\.first_api_level|new-instance .*SuggestedRepliesReceiver;' "$HB"/smali* \
              | xargs -r cp --parents -t /tmp/patchdbg || true
            find "$HB" -type f \( -name "SuggestedRepliesReceiver.smali*" -o -name "SuggestedRepliesViewModel.smali*" -o -name "*.orig" \) \
              -exec cp --parents {} /tmp/patchdbg \;
          fi
          # AODService font classes (ql2/rl2 are renamed between firmwares)
          find out/target -type f -path "*AODService*" \
            \( -name "ql2.smali" -o -name "rl2.smali" \) \
            -exec cp --parents {} /tmp/patchdbg \;
          find /tmp/patchdbg -type f | head -50

      - name: Upload patch debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-debug-${{ matrix.target }}
          path: /tmp/patchdbg
          if-no-files-found: warn

      # Full decoded HoneyBoard for rebasing rezoss keyboard patches
      - name: Collect HoneyBoard smali
        if: always() && matrix.target == 'dm1q'
        run: |
          HB=$(find out -type d -path "*apktool*" -name "HoneyBoard.apk" | head -1)
          if [ -n "$HB" ]; then
            tar -C "$(dirname "$HB")" -czf /tmp/honeyboard-smali.tgz \
              --exclude='*.orig' --exclude='*.rej' "$(basename "$HB")"
          fi

      - name: Upload HoneyBoard smali
        if: always() && matrix.target == 'dm1q'
        uses: actions/upload-artifact@v4
        with:
          name: honeyboard-smali-dm1q
          path: /tmp/honeyboard-smali.tgz
          if-no-files-found: ignore
        
      - name: Collect stock APKs for patch rebasing
        if: always() && matrix.target == 'dm1q'
        run: |
          FW="out/fw/$(cut -d / -f 1 <<< "$SOURCE_FIRMWARE")_$(cut -d / -f 2 <<< "$SOURCE_FIRMWARE")"
          mkdir -p /tmp/stock
          for p in system/system/framework/services.jar \
                   system/system/priv-app/SecSettings/SecSettings.apk \
                   system/system/priv-app/SettingsProvider/SettingsProvider.apk \
                   system/system/app/HoneyBoard/HoneyBoard.apk \
                   system_ext/priv-app/SystemUI/SystemUI.apk \
                   system/system/system_ext/priv-app/SystemUI/SystemUI.apk \
                   system/system/framework/framework-res.apk; do
            [ -f "$FW/$p" ] && cp --parents "$FW/$p" /tmp/stock/ || echo "missing: $p"
          done
          tar -C /tmp/stock -czf /tmp/stock-dm1q.tgz .

      - name: Upload stock APKs
        if: always() && matrix.target == 'dm1q'
        uses: actions/upload-artifact@v4
        with:
          name: stock-apks-dm1q
          path: /tmp/stock-dm1q.tgz
          if-no-files-found: ignore

      - name: Upload to GoFile
        id: gofile
        continue-on-error: true
        timeout-minutes: 40
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*sign_HZIJ.zip" | head -n 1)
          [ -n "$ZIP_FILE" ] || { echo "::error::No signed zip found"; exit 1; }
          echo "Uploading $ZIP_FILE ($(du -h "$ZIP_FILE" | cut -f1))"
          for SERVER in upload upload-eu-par upload-na-phx upload-ap-sgp; do
            for TRY in 1 2; do
              echo "- $SERVER.gofile.io (try $TRY)"
              RESPONSE=$(curl -sS --connect-timeout 30 --max-time 1500 --retry 2 --retry-delay 10 \
                -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER }}" \
                "https://$SERVER.gofile.io/uploadFile" || true)
              LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
              if [ -n "$LINK" ]; then
                echo "Download link: $LINK"
                echo "### ${{ matrix.target }}: $LINK" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "  failed: ${RESPONSE:0:200}"
            done
          done
          echo "::warning::GoFile upload failed on all servers, falling back to workflow artifact"
          exit 1

      - name: Upload ROM as artifact (GoFile fallback)
        if: steps.gofile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rom-${{ matrix.target }}
          path: out/*sign_HZIJ.zip
          compression-level: 0
          retention-days: 3
