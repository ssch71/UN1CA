name: DeX probe (Flip5 vs Fold5)

on:
  workflow_dispatch:

jobs:
  probe:
    name: Compare DeX bits
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler
          sudo apt install -yq "linux-modules-extra-$(uname -r)" || true
          sudo modprobe -a erofs f2fs || true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate build config
        run: |
          source ./buildenv.sh b5q
          {
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download Flip5 + Fold5 firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh SM-F946N/KOO/352926710431206

      - name: Extract firmwares
        run: ./scripts/extract_fw.sh SM-F946N/KOO/352926710431206

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0"

      - name: Probe DeX
        run: |
          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          OUT=/tmp/dex-probe
          mkdir -p "$OUT"
          for FW in SM-F731N_KOO SM-F946N_KOO; do
            D="$FW_DIR/$FW"
            R="$OUT/$FW.txt"
            {
              echo "### floating_feature"
              grep -iE "dex|desktop|display_?port|hdmi|usb_?c" "$D/system/system/etc/floating_feature.xml" || true
              echo "### build props"
              find "$D" -maxdepth 4 -name "build.prop" -exec grep -HiE "dex|desktop|freeform|display" {} \; || true
              echo "### app dirs"
              find "$D/system/system" "$D/system_ext" "$D/product" -maxdepth 3 -type d \
                \( -path "*/app/*" -o -path "*/priv-app/*" \) 2>/dev/null | sed "s|$D/||" | sort
              echo "### permissions/sysconfig/features mentioning dex|desktop"
              grep -rliE "dex|desktop" "$D/system/system/etc/permissions" "$D/system/system/etc/sysconfig" \
                "$D/system/system/etc/default-permissions" "$D/system_ext/etc" "$D/product/etc" \
                "$D/vendor/etc/permissions" 2>/dev/null | sed "s|$D/||" | sort
              echo "### hardware features"
              grep -rhoE 'feature name="[^"]+"' "$D/vendor/etc/permissions" "$D/system/system/etc/permissions" 2>/dev/null | sort -u
              echo "### framework-res desktop/dex/freeform values"
              "$AAPT2" dump resources "$D/system/system/framework/framework-res.apk" 2>/dev/null \
                | grep -iE -A1 "desktop|dex_|freeform|externaldisplay|external_display" | head -200
              echo "### vendor DP/USB-C display"
              find "$D/vendor" -maxdepth 4 \( -iname "*displayport*" -o -iname "*dp_*" -o -iname "*hdmi*" \) 2>/dev/null | sed "s|$D/||"
              grep -rhiE "displayport|dp_alt|usb_dp" "$D/vendor/etc/init" 2>/dev/null | head -20
            } > "$R"
          done
          diff <(sed -n '/### app dirs/,/### permissions/p' "$OUT/SM-F731N_KOO.txt") \
               <(sed -n '/### app dirs/,/### permissions/p' "$OUT/SM-F946N_KOO.txt") > "$OUT/apps-flip-vs-fold.diff" || true
          diff "$OUT/SM-F731N_KOO.txt" "$OUT/SM-F946N_KOO.txt" > "$OUT/all-flip-vs-fold.diff" || true
          wc -l "$OUT"/*

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: dex-probe
          path: /tmp/dex-probe
